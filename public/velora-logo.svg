  <!-- EDUCATION — bigger, tighter gap to lines -->
  <text
    x="190" y="82"
    font-family="'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif"
    font-size="17"
    font-weight="300"
    letter-spacing="6"
