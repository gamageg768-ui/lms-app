<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" fill="none">
  <!-- VELORA -->
  <text
    x="190" y="55"
    font-family="'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif"
    font-size="56"
    font-weight="300"
    letter-spacing="14"
    text-anchor="middle"
    fill="#111111"
  >VELORA</text>

  <!-- Left line (close to EDUCATION) -->
